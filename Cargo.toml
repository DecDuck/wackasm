[workspace]
members = ["crates/wackasm", "crates/wackasm-cli", "crates/wackasm-spec-tests"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
strip = "none"

[profile.bench]
debug = true

[patch.crates-io]
wasmparser = { path="./target/patch/wasmparser-0.262.0" }
