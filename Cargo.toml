[package]
name = "wackasm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitcode = { version = "0.6.9", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
self_cell = "1.2"
wasmparser = "0.262.0"
human_bytes = "0.4.3"
serde_arrays = "0.2.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "fuel_per_second"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
strip = "none"

[package.metadata.patch]
crates = ["wasmparser"]

[patch.crates-io]
wasmparser = { path="./target/patch/wasmparser-0.262.0" }
