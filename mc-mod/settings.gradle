pluginManagement {
    repositories {
        maven {
            // RetroFuturaGradle: maintained 1.7.10/1.12.2 Forge tooling
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Downloads the Java 8 toolchain Minecraft 1.12.2 needs.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'wackasm-oc-mod'
