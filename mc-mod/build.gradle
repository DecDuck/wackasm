plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.wackasm'
version = mod_version
base { archivesName = 'wackasm-oc' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        // runs/, not run/: keep dev worlds apart from anything else there.
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
    }
    mods {
        wackasm { sourceSet sourceSets.main }
    }
}
// The unit tests use Minecraft and OpenComputers classes (NBT, values), but
// not a running game.
neoForge.addModdingDependenciesTo(sourceSets.test)

repositories {
    maven {
        name = 'OpenComputers: Modernized'
        url = 'https://habzg.github.io/OpenComputers-Modernized/'
        content { includeGroup 'li.cil.oc' }
    }
}

dependencies {
    // The full mod (it includes the API), so the dev client and server have
    // OpenComputers loaded. NeoForge runs on Mojang's names, so the jar is
    // used as is.
    implementation "li.cil.oc:opencomputers-neoforge:${ocm_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

// ---------------------------------------------------------------------------
// The native side: cargo builds of the JNI library, BIOS, shell and
// programs, staged into the jar.
// ---------------------------------------------------------------------------

apply from: 'natives.gradle'

// ---------------------------------------------------------------------------
// Recipes. Minecraft 1.21 recipes are data, so the ones that make the
// WebAssembly BIOS EEPROM and the shell floppy are generated here. Their
// results are OpenComputers items carrying the same custom data that
// Items.registerEEPROM and Items.registerFloppy give them (see WackasmMod),
// which is why the BIOS bytes end up in the recipe.
// ---------------------------------------------------------------------------

def generateRecipes = tasks.register('generateRecipes') {
    group = 'wackasm'
    description = 'Writes the crafting recipes for the wasm BIOS EEPROM and the shell floppy'
    dependsOn 'stageNatives'
    def out = layout.buildDirectory.dir('generated/wackasm-data')
    def staged = layout.buildDirectory.dir('generated/wackasm-resources')
    inputs.dir staged
    outputs.dir out
    doLast {
        def bios = staged.get().file('assets/wackasm/bios.wasm').asFile.bytes
        def dir = out.get().dir('data/wackasm/recipe').asFile
        dir.mkdirs()
        def recipe = { String ingredient, String result, String snbt ->
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                type       : 'minecraft:crafting_shapeless',
                category   : 'misc',
                ingredients: [[item: ingredient], [item: 'minecraft:paper']],
                result     : [id: result, count: 1, components: ['minecraft:custom_data': snbt]],
            ]))
        }
        // Must match WackasmMod: the label, and the BIOS as the EEPROM's code.
        def code = bios.collect { "${it}b" }.join(',')
        new File(dir, 'wasm_bios.json').text = recipe('opencomputers:eeprom', 'opencomputers:eeprom',
                "{\"oc:data\":{\"oc:label\":\"EEPROM (WebAssembly BIOS)\",\"oc:eeprom\":[B;${code}],\"oc:readonly\":0b}}")
        // A loot disk refers to the file system WackasmMod registers by name.
        new File(dir, 'shell_floppy.json').text = recipe('opencomputers:floppy', 'opencomputers:floppy',
                '{"oc:data":{"oc:fs.label":"wackasm shell"},"oc:lootFactory":"wackasm:wackasm shell","oc:color":5}')
    }
}
sourceSets.main.resources.srcDir(generateRecipes)

processResources {
    def props = [version: project.version, minecraft_version: minecraft_version, neo_version: neo_version,
                 ocm_version: ocm_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}

jar {
    // The MIT licence asks for its notice in every copy.
    from(new File(projectDir.parentFile, 'LICENSE.txt')) { rename { 'LICENSE_wackasm.txt' } }
}
