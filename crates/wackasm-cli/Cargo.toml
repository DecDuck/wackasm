[package]
name = "wackasm-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wackasm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bitcode = { version = "0.6.9", features = ["serde"] }
human_bytes = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
wackasm = { path = "../wackasm" }
