[package]
name = "wackasm-oc-programs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example WASI programs that the wackasm shell runs from /bin on its floppy"

# Built only for wasm32-wasip1, so it lives outside the host workspace.
[workspace]

[dependencies]
wackasm-opencomputers = { path = "../wackasm-opencomputers", features = ["async"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
